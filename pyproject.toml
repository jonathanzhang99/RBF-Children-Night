description = ""
authors = [{ name = "Jonathan Zhang", email = "jonathan.z99@gmail.com" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "flask>=3.0.0,<4",
    "pyserial~=3.5",
    "flask-socketio>=5.3.6,<6",
    "pygame>=2.5.2,<3",
    "flask-cors>=4.0.0,<5",
    "ruff>=0.7.1,<0.8",
]

[dependency-groups]
